services:
  - type: web
    name: skylytics-backend
    env: python
    region: ohio
    plan: free
    rootDir: backend/skylitcs_backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skylytics-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"

databases:
  - name: skylytics-db
    region: ohio
    plan: free
